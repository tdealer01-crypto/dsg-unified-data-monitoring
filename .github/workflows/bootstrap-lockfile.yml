name: Bootstrap deterministic lockfile

on:
  push:
    branches: [integration/unified-monitoring-e2e]
    paths:
      - package.json
      - .github/workflows/bootstrap-lockfile.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Detect committed lockfile
        id: lock
        run: |
          if [ -f package-lock.json ]; then echo 'exists=true' >> "$GITHUB_OUTPUT"; else echo 'exists=false' >> "$GITHUB_OUTPUT"; fi
      - name: Generate lockfile from npm registry
        if: steps.lock.outputs.exists != 'true'
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile only
        if: steps.lock.outputs.exists != 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git diff --cached --exit-code && exit 1 || true
          git commit -m 'build: commit deterministic npm lockfile'
          git push origin HEAD:integration/unified-monitoring-e2e
